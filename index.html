<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:9px 12px;cursor:pointer}button:active{transform:scale(.98)}button.primary{background:var(--rose);color:white;border-color:var(--rose)}button.ghost{background:transparent}button.active{background:var(--rose2);border-color:#d9aab2}input,select,textarea{border:1px solid var(--line);border-radius:10px;background:#fffdfa;padding:10px;min-width:0}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#fffaf7dd;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}.brand{font-family:"Gowun Batang",serif;font-weight:bold;font-size:20px;color:#a75f70}.brand small{font:10px "Noto Sans KR";color:var(--muted);display:block;letter-spacing:1.5px}.head-actions{display:flex;gap:6px}.head-actions button{padding:8px}.layout{max-width:1200px;margin:auto;padding:14px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:14px}.panel,.work{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel{padding:13px;height:max-content}.section-title{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin:8px 2px}.project-row{display:flex;gap:6px;margin:7px 0}.project-row select{flex:1;width:100%}.tree{max-height:40vh;overflow:auto}.tree button{width:100%;text-align:left;margin:3px 0;background:transparent;border:0}.tree button.selected{background:var(--rose2);color:#8e4d5b}.tree .sub{padding-left:17px;font-size:13px}.small-actions{display:flex;gap:6px;flex-wrap:wrap}.small-actions button{font-size:12px;padding:7px}.work{min-width:0;overflow:hidden}.worktop{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.worktop input{flex:1;min-width:140px;border:0;background:transparent;font-size:18px;font-weight:700}.save-state{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:5px;padding:9px 13px;border-bottom:1px solid var(--line);overflow:auto}.tabs button{white-space:nowrap;font-size:12px}.editor-shell{padding:14px 14px 90px}.toolbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;background:#f8efeb;padding:8px;border-radius:13px;margin-bottom:12px}.toolbar button{padding:8px 10px;min-width:34px}.toolbar select{max-width:150px;padding:8px;font-size:12px}.toolbar input[type=color]{width:34px;height:34px;padding:3px}.toolbar .wide{min-width:80px}.editor{min-height:58vh;max-width:820px;margin:auto;padding:38px clamp(18px,6vw,72px);background:#fff;border:1px solid #eee5df;box-shadow:0 5px 18px #5a42300b;border-radius:5px;outline:none;font-family:"Noto Serif KR",serif;font-size:16px;line-height:1.9;overflow-wrap:anywhere;word-break:break-word}.editor:empty:before{content:"이곳을 눌러 이야기를 시작하세요.";color:#b8aaa3}.editor p{margin:0 0 .85em}.bottom-tools{position:fixed;z-index:30;bottom:0;left:0;right:0;padding:8px 10px calc(8px + var(--safe));display:flex;justify-content:center;gap:6px;overflow-x:auto;background:#fffaf7ed;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.bottom-tools button{flex:0 0 auto;padding:9px 12px}.stats{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}.stats b{color:var(--ink)}.hidden{display:none!important}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);margin:8px 0}.field input,.field textarea,.field select{width:100%}.card{border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;background:#fffaf7}.muted{color:var(--muted);font-size:12px}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px;border-bottom:1px solid var(--line)}.item button{padding:6px 8px;font-size:12px}.preview-page{width:min(100%,620px);min-height:760px;background:white;margin:12px auto;padding:60px 48px;box-shadow:var(--shadow);white-space:normal}.focus header,.focus .panel,.focus .tabs,.focus .worktop,.focus .stats{display:none}.focus .layout{display:block;max-width:900px;padding:0}.focus .work{border:0;box-shadow:none}.focus .editor-shell{padding:12px 8px 90px}.focus .editor{min-height:90vh;border:0;box-shadow:none;padding:30px 22px}.modal{position:fixed;inset:0;background:#33272266;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.modal-box{background:var(--paper);border-radius:18px;max-width:620px;width:100%;max-height:85vh;overflow:auto;padding:18px}.modal-box h3{margin-top:0}.font-list{max-height:45vh;overflow:auto}.font-option{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid var(--line);cursor:pointer}.notice{background:#f6e9e5;border-radius:12px;padding:10px;font-size:12px;line-height:1.6}.danger{color:#a64b50}.mobile-menu{display:none}
@media(max-width:760px){.layout{display:block;padding:8px}.panel{margin-bottom:8px}.panel.collapsed .panel-content{display:none}.mobile-menu{display:inline-flex}.tree{max-height:180px}.editor-shell{padding:10px 8px 90px}.toolbar{gap:4px}.toolbar select{max-width:112px}.toolbar button{padding:8px}.editor{min-height:62vh;padding:25px 18px;font-size:16px}.worktop{padding:10px}.preview-page{min-height:650px;padding:36px 24px}.hide-mobile{display:none}}

<body>
<header><div class="brand">다슬 한글 <small>WRITER'S STUDIO</small></div><div class="head-actions"><button id="backupBtn">백업</button><button id="focusBtn">집중 모드</button><button id="newProjectBtn" class="primary">＋ 작품</button></div></header>
<div class="layout">
<aside class="panel" id="sidePanel"><div class="section-title">내 작품</div><div class="project-row"><select id="projectSelect" aria-label="작품 선택"></select><button id="addChapterBtn" title="챕터 추가">＋</button></div><div class="tree" id="chapterTree"></div><div class="small-actions"><button id="renameChapterBtn">이름 변경</button><button id="deleteChapterBtn" class="danger">삭제</button><button id="moveUpBtn">↑</button><button id="moveDownBtn">↓</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="section-title">작품 도구</div><div class="small-actions"><button data-tab="notes">인물·세계관</button><button data-tab="materials">자료 보관함</button><button data-tab="versions">버전 기록</button><button data-tab="spell">맞춤법</button><button data-tab="toc">목차</button></div><p class="muted">문서는 이 기기의 브라우저에 저장됩니다. 브라우저 데이터 삭제 전 JSON 백업을 권장합니다.</p></aside>
<main class="work"><div class="worktop"><input id="chapterTitle" aria-label="챕터 제목" value="첫 번째 글"><span class="save-state" id="saveState">저장 준비</span></div><nav class="tabs"><button class="active" data-tab="write">집필</button><button data-tab="notes">인물·세계관</button><button data-tab="materials">자료</button><button data-tab="versions">버전</button><button data-tab="spell">맞춤법</button><button data-tab="preview">미리보기</button><button data-tab="toc">목차</button></nav>
<section id="writePanel" class="editor-shell"><div class="toolbar" id="toolbar">
<select id="fontSelect" class="wide" aria-label="글꼴"><option>글꼴 검색</option></select><select id="fontSize" aria-label="글자 크기"><option value="1">8pt</option><option value="2">10pt</option><option value="3" selected>12pt</option><option value="4">14pt</option><option value="5">18pt</option><option value="6">24pt</option><option value="7">36pt</option></select>
<button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><label title="글자색"><input type="color" id="textColor" value="#493d39"></label><label title="형광펜"><input type="color" id="highlightColor" value="#fff0a8"></label>
<button data-cmd="justifyLeft">≡</button><button data-cmd="justifyCenter">☰</button><button data-cmd="justifyRight">☷</button><select id="lineHeight" aria-label="줄 간격"><option value="1.5">줄 150%</option><option value="1.7" selected>줄 170%</option><option value="2">줄 200%</option><option value="2.5">줄 250%</option></select><button id="clearFormat">서식 지우기</button></div>
<div id="editor" class="editor" contenteditable="true" spellcheck="false" aria-label="원고 편집기"><p><br></p></div></section>
<section id="toolPanel" class="editor-shell hidden"></section><div class="stats"><span>현재 챕터 <b id="chapterCount">0자</b></span><span>작품 전체 <b id="projectCount">0자</b></span><span>전체 프로젝트 <b id="allCount">0자</b></span><span>공백 제외 <b id="noSpaceCount">0자</b></span></div></main></div>
<div class="bottom-tools"><button data-cmd="undo">↶ 실행 취소</button><button data-cmd="redo">↷ 다시 실행</button><button id="manualSave">스냅샷 저장</button><button id="exportHwpx" class="primary">HWPX 저장</button><button id="exportPdf">PDF 저장</button></div>
<div id="modalRoot"></div><input id="importFile" type="file" accept=".json,application/json" class="hidden"><input id="materialFile" type="file" accept="image/*" class="hidden">
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), uid=()=>Math.random().toString(36).slice(2,10), now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({schema:1,projects:[{id:uid(),name:'새 작품',genre:'소설',chapters:[{id:uid(),title:'1장 첫 번째 글',html:'<p><br></p>',updatedAt:now()}],notes:'',materials:[],versions:[]}],activeProject:null,activeChapter:null,updatedAt:now()});
let data=initial(),saveTimer=null,db=null,activeTab='write',selectionRange=null;
const project=()=>data.projects.find(p=>p.id===data.activeProject)||data.projects[0];
const chapter=()=>project()?.chapters.find(c=>c.id===data.activeChapter)||project()?.chapters[0];
function ensureActive(){if(!data.activeProject)data.activeProject=data.projects[0].id;if(!data.activeChapter)data.activeChapter=project().chapters[0].id}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return resolve(null);const req=indexedDB.open('dasul-hangul-db',1);req.onupgradeneeded=()=>req.result.createObjectStore('state');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbPut(key,value){if(!db)return;return new Promise((res,rej)=>{const tx=db.transaction('state','readwrite');tx.objectStore('state').put(value,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function dbGet(key){if(!db)return null;return new Promise((res,rej)=>{const tx=db.transaction('state','readonly'),r=tx.objectStore('state').get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function persist(){data.updatedAt=now();const raw=JSON.stringify(data);try{localStorage.setItem('dasul-hangul-backup',raw);await dbPut('main',data);$('saveState').textContent='저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}catch(e){$('saveState').textContent='저장 공간 확인 필요';console.error(e)}}
function scheduleSave(){ $('saveState').textContent='저장 중…';clearTimeout(saveTimer);saveTimer=setTimeout(persist,1200);updateStats()}
function snapshot(){const c=chapter();if(!c)return;project().versions.unshift({id:uid(),chapterId:c.id,title:c.title,html:c.html,createdAt:now()});project().versions=project().versions.slice(0,80);persist();renderTool('versions');alert('현재 챕터의 스냅샷을 저장했습니다.')}
function loadState(s){if(!s||!Array.isArray(s.projects)||!s.projects.length)throw Error('올바른 백업 파일이 아닙니다.');data=s;ensureActive();renderAll();persist()}
function textOf(html){const d=document.createElement('div');d.innerHTML=html;return d.innerText||d.textContent||''}
function count(s){return {all:[...s].length,plain:[...s.replace(/\s/g,'')].length}}
function updateStats(){if(!project())return;const c=chapter(),ct=count(textOf(c?.html||'')),pt=count(project().chapters.map(x=>textOf(x.html)).join('\n')),at=count(data.projects.flatMap(p=>p.chapters.map(x=>textOf(x.html))).join('\n'));$('chapterCount').textContent=ct.all.toLocaleString()+'자';$('projectCount').textContent=pt.all.toLocaleString()+'자';$('allCount').textContent=at.all.toLocaleString()+'자';$('noSpaceCount').textContent='현재 '+ct.plain.toLocaleString()+'자'}
function renderProjects(){const sel=$('projectSelect');sel.innerHTML=data.projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');sel.value=data.activeProject;const p=project();$('chapterTree').innerHTML=p.chapters.map((c,i)=>'<button data-chapter="'+c.id+'" class="'+(c.id===data.activeChapter?'selected':'')+'">'+(i+1)+'. '+esc(c.title)+'</button>').join('');}
function renderEditor(){const c=chapter();if(!c)return;$('chapterTitle').value=c.title;$('editor').innerHTML=c.html||'<p><br></p>';updateStats()}
function renderAll(){ensureActive();renderProjects();renderEditor();renderTool(activeTab)}
function setTab(t){activeTab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='write'){$('writePanel').classList.remove('hidden');$('toolPanel').classList.add('hidden')}else{$('writePanel').classList.add('hidden');$('toolPanel').classList.remove('hidden');renderTool(t)}}
function renderTool(t){const root=$('toolPanel');if(!root)return;const p=project();if(t==='notes'){root.innerHTML='<h3>인물 설정 & 세계관 메모</h3><p class="muted">인물, 배경, 사건, 설정을 자유롭게 기록하세요.</p><textarea id="notesText" rows="18" style="width:100%">'+esc(p.notes||'')+'</textarea><button class="primary" id="saveNotes">메모 저장</button>'; $('saveNotes').onclick=()=>{p.notes=$('notesText').value;scheduleSave();alert('메모를 저장했습니다.')};}
else if(t==='materials'){root.innerHTML='<h3>자료 보관함</h3><p class="muted">참고 링크와 메모, 이미지를 작품에 보관합니다.</p><div class="field">자료 제목<input id="matTitle" placeholder="자료 제목"></div><div class="field">링크 또는 메모<textarea id="matBody" rows="3" placeholder="URL 또는 참고 내용"></textarea></div><div class="small-actions"><button id="addMaterial" class="primary">자료 추가</button><button id="addImage">이미지 추가</button></div>'+p.materials.map(m=>'<div class="card"><b>'+esc(m.title)+'</b><p>'+esc(m.body||'')+'</p>'+(m.image?'<img src="'+m.image+'" style="max-width:100%;border-radius:8px">':'')+'<button data-delmat="'+m.id+'">삭제</button></div>').join('');$('addMaterial').onclick=()=>{p.materials.unshift({id:uid(),title:$('matTitle').value||'제목 없는 자료',body:$('matBody').value,createdAt:now()});scheduleSave();renderTool('materials')};$('addImage').onclick=()=>$('materialFile').click();root.querySelectorAll('[data-delmat]').forEach(b=>b.onclick=()=>{p.materials=p.materials.filter(m=>m.id!==b.dataset.delmat);scheduleSave();renderTool('materials')});}
else if(t==='versions'){const vs=p.versions||[];root.innerHTML='<h3>버전 기록</h3><p class="muted">스냅샷은 현재 작품의 챕터별 원고를 보관합니다.</p><button class="primary" id="makeSnapshot">현재 원고 스냅샷 저장</button>'+vs.map(v=>'<div class="item"><div><b>'+esc(v.title)+'</b><div class="muted">'+new Date(v.createdAt).toLocaleString('ko-KR')+'</div></div><div><button data-preview="'+v.id+'">미리보기</button><button data-restore="'+v.id+'">복구</button></div></div>').join('');$('makeSnapshot').onclick=snapshot;root.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>showModal('스냅샷 미리보기',vs.find(v=>v.id===b.dataset.preview)?.html||''));root.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const v=vs.find(x=>x.id===b.dataset.restore);if(v&&confirm('현재 원고를 스냅샷 내용으로 복구할까요? 먼저 현재 내용의 스냅샷을 저장하는 것을 권장합니다.')){chapter().html=v.html;renderEditor();scheduleSave();setTab('write')}})}
else if(t==='spell'){const txt=textOf(chapter().html),rules=[[/\s{2,}/g,'  ','연속된 공백'],[/\.{2,}/g,'…','마침표 반복'],[/\?{2,}/g,'?','물음표 반복'],[/!{2,}/g,'!','느낌표 반복'],[/\s+([,.!?])/g,'$1','문장부호 앞 공백'],[/([,.!?])([^\s\n])/g,'$1 $2','문장부호 뒤 띄어쓰기']];let found=[];rules.forEach(([re,to,label])=>{const m=txt.match(re);if(m)found.push({label,example:m[0],to})});root.innerHTML='<h3>맞춤법·문장 다듬기</h3><div class="notice">이 패널은 오프라인 규칙 기반의 간단한 점검입니다. 국립국어원 수준의 전체 맞춤법 검사나 문맥 판단을 대체하지 않습니다.</div>'+ (found.length?found.map(f=>'<div class="item"><div><b>'+f.label+'</b><div class="muted">발견: '+esc(f.example)+' → 제안: '+esc(f.to)+'</div></div><button data-fix="'+esc(f.label)+'">수정 제안 적용</button></div>').join(''):'<p>기본 규칙에서 발견된 항목이 없습니다.</p>')+'<button id="recheck">다시 검사</button>';root.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{let html=chapter().html;const replacements={'연속된 공백':['  ',' '],'마침표 반복':['..','…'],'물음표 반복':['??','?'],'느낌표 반복':['!!','!'],'문장부호 앞 공백':[' ,',','],'문장부호 뒤 띄어쓰기':[',',' ,']};const pair=replacements[b.dataset.fix];if(pair){const plain=textOf(html);const updated=plain.replace(/\s{2,}/g,' ').replace(/\s+([,.!?])/g,'$1').replace(/([,.!?])([^\s\n])/g,'$1 $2');chapter().html='<p>'+esc(updated).replace(/\n/g,'</p><p>')+'</p>';renderEditor();scheduleSave();setTab('spell')}});$('recheck').onclick=()=>renderTool('spell')}
else if(t==='preview'){const sizes={'A4':'210mm 297mm','신국판':'152mm 225mm','국판':'148mm 210mm','46판':'128mm 188mm'};root.innerHTML='<h3>원고 미리보기</h3><label class="field">판형<select id="paperSize">'+Object.keys(sizes).map(x=>'<option>'+x+'</option>').join('')+'</select></label><div class="preview-page" id="previewPage">'+chapter().html+'</div><button id="printPreview" class="primary">인쇄 / PDF 저장</button>';$('paperSize').onchange=()=>{$('previewPage').style.width=sizes[$('paperSize').value].split(' ')[0];$('previewPage').style.minHeight=sizes[$('paperSize').value].split(' ')[1]};$('printPreview').onclick=()=>window.print()}
else if(t==='toc'){root.innerHTML='<h3>자동 목차</h3><p class="muted">작품의 챕터 제목을 기준으로 생성합니다.</p><ol>'+p.chapters.map(c=>'<li>'+esc(c.title)+'</li>').join('')+'</ol><button id="copyToc">목차 복사</button>'; $('copyToc').onclick=()=>navigator.clipboard?.writeText(p.chapters.map((c,i)=>(i+1)+'. '+c.title).join('\n')).then(()=>alert('목차를 복사했습니다.')).catch(()=>alert('브라우저에서 클립보드 권한을 허용해 주세요.'))}
}
