<style>
:root{--bg:#f8f1ec;--paper:#fffdfa;--ink:#493d39;--muted:#8c7d76;--line:#eaded7;--rose:#c9828f;--rose2:#f2dce0;--sage:#e6eee5;--shadow:0 8px 28px #60463a12;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);background:#fffaf7;border-radius:12px;padding:9px 12px;cursor:pointer}button:active{transform:scale(.98)}button.primary{background:var(--rose);color:white;border-color:var(--rose)}button.ghost{background:transparent}button.active{background:var(--rose2);border-color:#d9aab2}input,select,textarea{border:1px solid var(--line);border-radius:10px;background:#fffdfa;padding:10px;min-width:0}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#fffaf7dd;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}.brand{font-family:"Gowun Batang",serif;font-weight:bold;font-size:20px;color:#a75f70}.brand small{font:10px "Noto Sans KR";color:var(--muted);display:block;letter-spacing:1.5px}.head-actions{display:flex;gap:6px}.head-actions button{padding:8px}.layout{max-width:1200px;margin:auto;padding:14px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:14px}.panel,.work{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel{padding:13px;height:max-content}.section-title{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin:8px 2px}.project-row{display:flex;gap:6px;margin:7px 0}.project-row select{flex:1;width:100%}.tree{max-height:40vh;overflow:auto}.tree button{width:100%;text-align:left;margin:3px 0;background:transparent;border:0}.tree button.selected{background:var(--rose2);color:#8e4d5b}.tree .sub{padding-left:17px;font-size:13px}.small-actions{display:flex;gap:6px;flex-wrap:wrap}.small-actions button{font-size:12px;padding:7px}.work{min-width:0;overflow:hidden}.worktop{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.worktop input{flex:1;min-width:140px;border:0;background:transparent;font-size:18px;font-weight:700}.save-state{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:5px;padding:9px 13px;border-bottom:1px solid var(--line);overflow:auto}.tabs button{white-space:nowrap;font-size:12px}.editor-shell{padding:14px 14px 90px}.toolbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;background:#f8efeb;padding:8px;border-radius:13px;margin-bottom:12px}.toolbar button{padding:8px 10px;min-width:34px}.toolbar select{max-width:150px;padding:8px;font-size:12px}.toolbar #fontSearch{width:125px;max-width:34vw;padding:8px;font-size:12px}.toolbar #fontPreview{font-size:12px;white-space:nowrap;color:var(--muted);max-width:125px;overflow:hidden;text-overflow:ellipsis}.toolbar input[type=color]{width:34px;height:34px;padding:3px}.toolbar .wide{min-width:80px}.editor{min-height:58vh;max-width:820px;margin:auto;padding:38px clamp(18px,6vw,72px);background:#fff;border:1px solid #eee5df;box-shadow:0 5px 18px #5a42300b;border-radius:5px;outline:none;font-family:"Noto Serif KR",serif;font-size:16px;line-height:1.9;overflow-wrap:anywhere;word-break:break-word}.editor:empty:before{content:"이곳을 눌러 이야기를 시작하세요.";color:#b8aaa3}.editor p{margin:0 0 .85em}.bottom-tools{position:fixed;z-index:30;bottom:0;left:0;right:0;padding:8px 10px calc(8px + var(--safe));display:flex;justify-content:center;gap:6px;overflow-x:auto;background:#fffaf7ed;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.bottom-tools button{flex:0 0 auto;padding:9px 12px}.stats{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}.stats b{color:var(--ink)}.hidden{display:none!important}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);margin:8px 0}.field input,.field textarea,.field select{width:100%}.card{border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;background:#fffaf7}.muted{color:var(--muted);font-size:12px}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px;border-bottom:1px solid var(--line)}.item button{padding:6px 8px;font-size:12px}.preview-page{width:min(100%,620px);min-height:760px;background:white;margin:12px auto;padding:60px 48px;box-shadow:var(--shadow);white-space:normal}.focus header,.focus .panel,.focus .tabs,.focus .worktop,.focus .stats{display:none}.focus .layout{display:block;max-width:900px;padding:0}.focus .work{border:0;box-shadow:none}.focus .editor-shell{padding:12px 8px 90px}.focus .editor{min-height:90vh;border:0;box-shadow:none;padding:30px 22px}.modal{position:fixed;inset:0;background:#33272266;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.modal-box{background:var(--paper);border-radius:18px;max-width:620px;width:100%;max-height:85vh;overflow:auto;padding:18px}.modal-box h3{margin-top:0}.font-list{max-height:45vh;overflow:auto}.font-option{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid var(--line);cursor:pointer}.notice{background:#f6e9e5;border-radius:12px;padding:10px;font-size:12px;line-height:1.6}.danger{color:#a64b50}.mobile-menu{display:none}
@media(max-width:760px){.layout{display:block;padding:8px}.panel{margin-bottom:8px}.panel.collapsed .panel-content{display:none}.mobile-menu{display:inline-flex}.tree{max-height:180px}.editor-shell{padding:10px 8px 90px}.toolbar{gap:4px}.toolbar select{max-width:112px}.toolbar button{padding:8px}.editor{min-height:62vh;padding:25px 18px;font-size:16px}.worktop{padding:10px}.preview-page{min-height:650px;padding:36px 24px}.hide-mobile{display:none}}
</style></head>
<body>
<header><div class="brand">다슬 한글 <small>WRITER'S STUDIO</small></div><div class="head-actions"><button id="backupBtn">백업</button><button id="focusBtn">집중 모드</button><button id="newProjectBtn" class="primary">＋ 작품</button></div></header>
<div class="layout">
<aside class="panel" id="sidePanel"><div class="section-title">내 작품</div><div class="project-row"><select id="projectSelect" aria-label="작품 선택"></select><button id="addChapterBtn" title="챕터 추가">＋</button></div><div class="tree" id="chapterTree"></div><div class="small-actions"><button id="renameChapterBtn">이름 변경</button><button id="deleteChapterBtn" class="danger">삭제</button><button id="moveUpBtn">↑</button><button id="moveDownBtn">↓</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="section-title">작품 도구</div><div class="small-actions"><button data-tab="notes">인물·세계관</button><button data-tab="materials">자료 보관함</button><button data-tab="versions">버전 기록</button><button data-tab="spell">맞춤법</button><button data-tab="toc">목차</button></div><p class="muted">문서는 이 기기의 브라우저에 저장됩니다. 브라우저 데이터 삭제 전 JSON 백업을 권장합니다.</p></aside>
<main class="work"><div class="worktop"><input id="chapterTitle" aria-label="챕터 제목" value="첫 번째 글"><span class="save-state" id="saveState">저장 준비</span></div><nav class="tabs"><button class="active" data-tab="write">집필</button><button data-tab="notes">인물·세계관</button><button data-tab="materials">자료</button><button data-tab="versions">버전</button><button data-tab="spell">맞춤법</button><button data-tab="preview">미리보기</button><button data-tab="toc">목차</button></nav>
<section id="writePanel" class="editor-shell"><div class="toolbar" id="toolbar">
<input id="fontSearch" aria-label="글꼴 검색" placeholder="글꼴 검색" autocomplete="off"><select id="fontSelect" class="wide" aria-label="글꼴 선택"><option value="">글꼴 선택</option></select><button id="fontFavorite" type="button" title="선택한 글꼴 즐겨찾기">☆</button><button id="fontFavoritesOnly" type="button" title="즐겨찾기만 보기">즐겨찾기</button><span id="fontPreview">가나다 ABC 123</span><select id="fontSize" aria-label="글자 크기"><option value="1">8pt</option><option value="2">10pt</option><option value="3" selected>12pt</option><option value="4">14pt</option><option value="5">18pt</option><option value="6">24pt</option><option value="7">36pt</option></select>
<button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><label title="글자색"><input type="color" id="textColor" value="#493d39"></label><label title="형광펜"><input type="color" id="highlightColor" value="#fff0a8"></label>
<button data-cmd="justifyLeft">≡</button><button data-cmd="justifyCenter">☰</button><button data-cmd="justifyRight">☷</button><select id="lineHeight" aria-label="줄 간격"><option value="1.5">줄 150%</option><option value="1.7" selected>줄 170%</option><option value="2">줄 200%</option><option value="2.5">줄 250%</option></select><button id="clearFormat">서식 지우기</button></div>
<div id="editor" class="editor" contenteditable="true" spellcheck="false" aria-label="원고 편집기"><p><br></p></div></section>
<section id="toolPanel" class="editor-shell hidden"></section><div class="stats"><span>현재 챕터 <b id="chapterCount">0자</b></span><span>작품 전체 <b id="projectCount">0자</b></span><span>전체 프로젝트 <b id="allCount">0자</b></span><span>공백 제외 <b id="noSpaceCount">0자</b></span></div></main></div>
<div class="bottom-tools"><button data-cmd="undo">↶ 실행 취소</button><button data-cmd="redo">↷ 다시 실행</button><button id="manualSave">스냅샷 저장</button><button id="exportHwpx" class="primary">HWPX 저장</button><button id="exportHwp">HWP 저장</button><button id="exportPdf">PDF 저장</button></div>
<div id="modalRoot"></div><input id="importFile" type="file" accept=".json,application/json" class="hidden"><input id="materialFile" type="file" accept="image/*" class="hidden">
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), uid=()=>Math.random().toString(36).slice(2,10), now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({schema:1,projects:[{id:uid(),name:'새 작품',genre:'소설',chapters:[{id:uid(),title:'1장 첫 번째 글',html:'<p><br></p>',updatedAt:now()}],notes:'',materials:[],versions:[]}],activeProject:null,activeChapter:null,updatedAt:now()});
let data=initial(),saveTimer=null,db=null,activeTab='write',selectionRange=null;
const project=()=>data.projects.find(p=>p.id===data.activeProject)||data.projects[0];
const chapter=()=>project()?.chapters.find(c=>c.id===data.activeChapter)||project()?.chapters[0];
function ensureActive(){
 if(!data||!Array.isArray(data.projects))data={schema:1,projects:[]};
 if(!data.projects.length)data.projects.push({id:uid(),name:'새 작품',genre:'소설',chapters:[],notes:'',materials:[],versions:[]});
 data.projects.forEach(p=>{
  if(!p.id)p.id=uid();if(!p.name)p.name='이름 없는 작품';if(!Array.isArray(p.chapters))p.chapters=[];
  if(!p.chapters.length)p.chapters.push({id:uid(),title:'1장',html:'<p><br></p>',updatedAt:now()});
  p.chapters.forEach(c=>{if(!c.id)c.id=uid();if(typeof c.title!=='string')c.title='제목 없는 챕터';if(typeof c.html!=='string')c.html='<p><br></p>'});
  if(typeof p.notes!=='string')p.notes='';if(!Array.isArray(p.materials))p.materials=[];if(!Array.isArray(p.versions))p.versions=[];
 });
 if(!data.projects.some(p=>p.id===data.activeProject))data.activeProject=data.projects[0].id;
 const active=project();
 if(!active.chapters.some(c=>c.id===data.activeChapter))data.activeChapter=active.chapters[0].id;
}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return resolve(null);const req=indexedDB.open('dasul-hangul-db',1);req.onupgradeneeded=()=>req.result.createObjectStore('state');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbPut(key,value){if(!db)return;return new Promise((res,rej)=>{const tx=db.transaction('state','readwrite');tx.objectStore('state').put(value,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function dbGet(key){if(!db)return null;return new Promise((res,rej)=>{const tx=db.transaction('state','readonly'),r=tx.objectStore('state').get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function persist(){
 data.updatedAt=now();const raw=JSON.stringify(data);let localOk=false,dbOk=false,saveError=null;
 try{localStorage.setItem('dasul-hangul-backup',raw);localOk=true}catch(e){saveError=e}
 try{if(db){await dbPut('main',data);dbOk=true}}catch(e){saveError=e}
 if(localOk||dbOk){$('saveState').textContent='저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+(localOk&&dbOk?'':' · 보조 저장소 사용 불가')}
 else{$('saveState').textContent='저장 실패 · 백업을 다운로드해 주세요';console.error('저장 실패',saveError)}
}
function scheduleSave(){ $('saveState').textContent='저장 중…';clearTimeout(saveTimer);saveTimer=setTimeout(persist,1200);updateStats()}
function snapshot(){const c=chapter();if(!c)return;project().versions.unshift({id:uid(),chapterId:c.id,title:c.title,html:c.html,createdAt:now()});project().versions=project().versions.slice(0,80);persist();renderTool('versions');alert('현재 챕터의 스냅샷을 저장했습니다.')}
function loadState(s){
 if(!s||!Array.isArray(s.projects)||!s.projects.length)throw Error('올바른 백업 파일이 아닙니다.');
 data=s;ensureActive();renderAll();scheduleSave();
}
function textOf(html){const d=document.createElement('div');d.innerHTML=html;return d.innerText||d.textContent||''}
function count(s){return {all:[...s].length,plain:[...s.replace(/\s/g,'')].length}}
function updateStats(){if(!project())return;const c=chapter(),ct=count(textOf(c?.html||'')),pt=count(project().chapters.map(x=>textOf(x.html)).join('\n')),at=count(data.projects.flatMap(p=>p.chapters.map(x=>textOf(x.html))).join('\n'));$('chapterCount').textContent=ct.all.toLocaleString()+'자';$('projectCount').textContent=pt.all.toLocaleString()+'자';$('allCount').textContent=at.all.toLocaleString()+'자';$('noSpaceCount').textContent='현재 '+ct.plain.toLocaleString()+'자'}
function renderProjects(){const sel=$('projectSelect');sel.innerHTML=data.projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');sel.value=data.activeProject;const p=project();$('chapterTree').innerHTML=p.chapters.map((c,i)=>'<button data-chapter="'+c.id+'" class="'+(c.id===data.activeChapter?'selected':'')+'">'+(i+1)+'. '+esc(c.title)+'</button>').join('');}
function renderEditor(){const c=chapter();if(!c)return;$('chapterTitle').value=c.title;$('editor').innerHTML=c.html||'<p><br></p>';updateStats()}
function renderAll(){ensureActive();renderProjects();renderEditor();renderTool(activeTab)}
function setTab(t){activeTab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='write'){$('writePanel').classList.remove('hidden');$('toolPanel').classList.add('hidden')}else{$('writePanel').classList.add('hidden');$('toolPanel').classList.remove('hidden');renderTool(t)}}
function renderTool(t){const root=$('toolPanel');if(!root)return;const p=project();if(t==='notes'){root.innerHTML='<h3>인물 설정 & 세계관 메모</h3><p class="muted">인물, 배경, 사건, 설정을 자유롭게 기록하세요.</p><textarea id="notesText" rows="18" style="width:100%">'+esc(p.notes||'')+'</textarea><button class="primary" id="saveNotes">메모 저장</button>'; $('saveNotes').onclick=()=>{p.notes=$('notesText').value;scheduleSave();alert('메모를 저장했습니다.')};}
else if(t==='materials'){root.innerHTML='<h3>자료 보관함</h3><p class="muted">참고 링크와 메모, 이미지를 작품에 보관합니다.</p><div class="field">자료 제목<input id="matTitle" placeholder="자료 제목"></div><div class="field">링크 또는 메모<textarea id="matBody" rows="3" placeholder="URL 또는 참고 내용"></textarea></div><div class="small-actions"><button id="addMaterial" class="primary">자료 추가</button><button id="addImage">이미지 추가</button></div>'+p.materials.map(m=>'<div class="card"><b>'+esc(m.title)+'</b><p>'+esc(m.body||'')+'</p>'+(m.image?'<img src="'+m.image+'" style="max-width:100%;border-radius:8px">':'')+'<button data-delmat="'+m.id+'">삭제</button></div>').join('');$('addMaterial').onclick=()=>{p.materials.unshift({id:uid(),title:$('matTitle').value||'제목 없는 자료',body:$('matBody').value,createdAt:now()});scheduleSave();renderTool('materials')};$('addImage').onclick=()=>$('materialFile').click();root.querySelectorAll('[data-delmat]').forEach(b=>b.onclick=()=>{p.materials=p.materials.filter(m=>m.id!==b.dataset.delmat);scheduleSave();renderTool('materials')});}
else if(t==='versions'){const vs=p.versions||[];root.innerHTML='<h3>버전 기록</h3><p class="muted">스냅샷은 현재 작품의 챕터별 원고를 보관합니다.</p><button class="primary" id="makeSnapshot">현재 원고 스냅샷 저장</button>'+vs.map(v=>'<div class="item"><div><b>'+esc(v.title)+'</b><div class="muted">'+new Date(v.createdAt).toLocaleString('ko-KR')+'</div></div><div><button data-preview="'+v.id+'">미리보기</button><button data-restore="'+v.id+'">복구</button></div></div>').join('');$('makeSnapshot').onclick=snapshot;root.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>showModal('스냅샷 미리보기',vs.find(v=>v.id===b.dataset.preview)?.html||''));root.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const v=vs.find(x=>x.id===b.dataset.restore);if(v&&confirm('현재 원고를 스냅샷 내용으로 복구할까요? 먼저 현재 내용의 스냅샷을 저장하는 것을 권장합니다.')){chapter().html=v.html;renderEditor();scheduleSave();setTab('write')}})}

function saveBlob(blob,filename){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href)}
const exportName=c=>c.title.replace(/[\\/:*?"<>|]/g,'_')||'document';
async function exportHwpx(){
 if(!window.JSZip){alert('HWPX 생성 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');return}
 const p=project(),c=chapter(),parts=buildHwpxParts(p,c,htmlToParagraphs(c.html)),zip=new JSZip();
 zip.file('mimetype',parts.mimetype,{compression:'STORE',createFolders:false}); /* 반드시 첫 엔트리 + 무압축 */
 Object.keys(parts.files).forEach(n=>zip.file(n,parts.files[n],{compression:'DEFLATE',createFolders:false}));
 const blob=await zip.generateAsync({type:'blob',mimeType:'application/hwp+zip',compression:'DEFLATE'});
 saveBlob(blob,exportName(c)+'.hwpx');
 alert('HWPX로 저장했습니다. 한컴오피스에서 열어 서식을 확인해 주세요.');
}
/* ---------- HWP(5.0 바이너리) 저장: 버튼을 누른 시점에 라이브러리를 동적 import ---------- */
const HWP_SIZE={body:1000,title:1600,sub:1300,h3:1200,quote:1000};
async function exportHwp(){
 let lib;
 try{lib=await import('https://esm.sh/hwplib-js')}
 catch(e){console.error(e);alert('HWP 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요. HWPX 저장은 그대로 사용할 수 있습니다.');return}
 try{
  const c=chapter(),{HWPWriter,BlankFileMaker}=lib;
  if(!HWPWriter||typeof HWPWriter.toBytes!=='function'||!BlankFileMaker)throw Error('hwplib-js에서 HWPWriter/BlankFileMaker를 찾지 못했습니다');
  const hwp=BlankFileMaker.make(),docInfo=hwp.docInfo,sec=hwp.bodyText.sectionList[0];
  if(!sec||typeof sec.getParagraph!=='function')throw Error('빈 문서의 구역을 찾지 못했습니다');
  /* 문단 목록: 제목 + 본문(htmlToParagraphs 결과의 runs/style 사용) */
  const items=[{text:c.title,style:'title',runs:[{text:c.title,bold:true,italic:false}]}].concat(htmlToParagraphs(c.html));
  const baseChar=docInfo.charShapeList[1]||docInfo.charShapeList[0];
  const shapeIds={};
  const shapeId=(size,bold,italic)=>{ /* 필요한 글자 모양을 docInfo에 한 번만 만들어 재사용 */
   const key=size+'|'+(bold?1:0)+'|'+(italic?1:0);
   if(shapeIds[key]!=null)return shapeIds[key];
   const cs=baseChar.clone();cs.setBaseSize(size);cs.property.setBold(!!bold);cs.property.setItalic(!!italic);
   docInfo.charShapeList.push(cs);shapeIds[key]=docInfo.charShapeList.length-1;return shapeIds[key];
  };
  const tplPar=sec.getParagraph(0),tplLine=tplPar.lineSeg.lineSegItemList[0],tplPair=tplPar.charShape.positionShapeIdPairList[0];
  const PAGE_W=42520; /* 기본 A4 본문 폭(HWPUNIT) */
  items.forEach((it,i)=>{
   const p=i===0?tplPar:sec.addNewParagraph();
   if(i>0)p.createText();
   if(!p.charShape)p.createCharShape();
   if(!p.lineSeg)p.createLineSeg();
   const size=HWP_SIZE[it.style]||HWP_SIZE.body;
   const runs=(it.runs&&it.runs.length)?it.runs:[{text:it.text||'',bold:false,italic:false}];
   const off=(p.text.charList||[]).filter(ch=>ch.getCode&&ch.getCode()!==13).length; /* 0번 문단의 구역/단 정의 문자 수 */
   const pairs=[];
   let text='';
   const addPair=(pos,sid)=>{const pr=tplPair.clone();pr.setPosition(pos);pr.setShapeId(sid);pairs.push(pr)};
   runs.forEach(r=>{
    const t=String(r.text==null?'':r.text).replace(/[\r\n]+/g,' ');
    if(!t)return;
    const sid=shapeId(size,!!r.bold||it.style==='title'||it.style==='sub'||it.style==='h3',!!r.italic||it.style==='quote');
    if(!pairs.length&&off>0)addPair(0,sid); /* 앞쪽 제어 문자용 */
    if(!pairs.length||pairs[pairs.length-1].getShapeId()!==sid)addPair(off+text.length,sid);
    text+=t;p.text.addString(t);
   });
   if(!pairs.length)addPair(0,shapeId(size,false,false));
   if(!text)p.text.processEndOfParagraph(); /* 빈 문단도 문단 끝 문자를 갖도록 */
   p.charShape.positionShapeIdPairList.length=0;pairs.forEach(x=>p.charShape.positionShapeIdPairList.push(x));
   /* 줄 정보(한컴이 줄 나눔을 그대로 그리도록 직접 계산) */
   const lh=Math.round(size*1.6),lhText=size,lspace=lh-lhText,baseLine=Math.round(size*0.85);
   p.lineSeg.lineSegItemList.length=0;
   let line=0;
   const addLine=start=>{
    const item=tplLine.clone();
    item.setTextStartPosition(off+start);item.setLineVerticalPosition(line*lh);item.setLineHeight(lh);
    item.setTextPartHeight(lhText);item.setDistanceBaseLineToLineVerticalPosition(baseLine);
    item.setLineSpace(lspace);item.setStartPositionFromColumn(0);item.setSegmentWidth(PAGE_W);
    p.lineSeg.lineSegItemList.push(item);line++;
   };
   const chars=[...text];let lineStart=0,width=0;
   chars.forEach((ch,k)=>{const cw=(ch.codePointAt(0)>=0x1100)?size:size/2;if(width+cw>PAGE_W){addLine(lineStart);lineStart=k;width=0}width+=cw});
   addLine(lineStart);
  });
  const bytes=HWPWriter.toBytes(hwp);
  saveBlob(new Blob([bytes],{type:'application/x-hwp'}),exportName(c)+'.hwp');
  alert('HWP로 저장했습니다. 한컴오피스에서 열어 내용을 확인해 주세요.');
 }catch(e){console.error(e);alert('HWP 저장에 실패했습니다: '+e.message+'\nHWPX 저장은 그대로 사용할 수 있습니다.')}
}
